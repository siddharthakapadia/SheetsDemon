name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Live-Excel features are macOS-only, but the engine, the web app and the
    # provider layer are not — so prove that on every platform rather than
    # claiming it in the README.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # tests/test_live_excel.py is deliberately excluded: it drives a real
      # Microsoft Excel instance over AppleScript and cannot run on a runner.
      - name: Engine suite
        run: python tests/test_all.py

      - name: Chatbot suite
        run: python tests/test_chatbot.py

      - name: Provider suite
        run: python tests/test_providers.py
